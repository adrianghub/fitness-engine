# yaml-language-server: $schema=https://schema.typesync.org/v0.13.json

# Enums
UserLevel:
  model: alias
  docs: Represents user's fitness level
  type:
    type: enum
    members:
      - label: Beginner
        value: beginner
      - label: Intermediate
        value: intermediate
      - label: Advanced
        value: advanced

ChallengeType:
  model: alias
  docs: Represents the type of challenge
  type:
    type: enum
    members:
      - label: Daily
        value: daily
      - label: Regular
        value: regular
      - label: Universal
        value: universal

ChallengeLevel:
  model: alias
  docs: Represents the level of a challenge
  type:
    type: enum
    members:
      - label: Beginner
        value: beginner
      - label: Intermediate
        value: intermediate
      - label: Advanced
        value: advanced

ChallengeStatus:
  model: alias
  docs: Represents the status of a user's challenge
  type:
    type: enum
    members:
      - label: Not Started
        value: not-started
      - label: In Progress
        value: in-progress
      - label: Completed
        value: completed
      - label: Uncompleted
        value: uncompleted

EntityType:
  model: alias
  docs: Represents the type of entity in the leaderboard
  type:
    type: enum
    members:
      - label: User
        value: user
      - label: Opponent
        value: opponent

FitnessGoal:
  model: alias
  docs: Represents a fitness goal that a user can have
  type: string

Equipment:
  model: alias
  docs: Represents equipment that a user can have
  type: string

TimestampOrNil:
  model: alias
  type:
    type: union
    variants:
      - timestamp
      - nil

# Document Models
User:
  model: document
  path: users/{userId}
  docs: Represents a user in the fitness application
  type:
    type: object
    fields:
      email:
        type: string
        docs: User's email address (unique)
      displayName:
        type: string
        optional: true
        docs: User's display name
      level:
        type: UserLevel
        docs: User's fitness level
      fitnessGoals:
        optional: true
        docs: Array of user's fitness goals
        type:
          type: list
          elementType: FitnessGoal
      equipment:
        optional: true
        docs: Array of equipment that the user has access to
        type:
          type: list
          elementType: Equipment
      points:
        type: double
        docs: Total points accumulated by the user
      isProfileComplete:
        type: boolean
        docs: Whether the user's profile is complete
      createdAt:
        type: timestamp
        optional: true
        docs: When the user account was created
      updatedAt:
        type: timestamp
        optional: true
        docs: When the user account was last updated
      lastOpponentRegeneration:
        type: timestamp
        optional: true
        docs: Timestamp of last opponent generation

ChallengeTemplate:
  model: document
  path: challengeTemplates/{challengeId}
  docs: Represents a challenge template that can be assigned to users
  type:
    type: object
    fields:
      title:
        type: string
        docs: Title of the challenge
      description:
        type: string
        docs: Detailed description of the challenge
      level:
        type: ChallengeLevel
        docs: Required fitness level for the challenge
      equipment:
        docs: Array of equipment that the challenge requires
        type:
          type: list
          elementType: Equipment
      expectedTime:
        type: string
        docs: Expected time to complete the challenge
      createdAt:
        type: timestamp
        optional: true
        docs: When the challenge template was created
      updatedAt:
        type: timestamp
        optional: true
        docs: When the challenge template was last updated

UniversalChallenge:
  model: document
  path: universalChallenges/{universalChallengeId}
  docs: Represents a universal challenge that is always available
  type:
    type: object
    fields:
      title:
        type: string
        docs: Title of the challenge
      description:
        type: string
        docs: Detailed description of the challenge
      points:
        type: double
        docs: Points awarded for completing the challenge
      createdAt:
        type: timestamp
        optional: true
        docs: When the challenge was created
      updatedAt:
        type: timestamp
        optional: true
        docs: When the challenge was last updated
      status:
        type: ChallengeStatus
        docs: Current status of the challenge

UserChallenge:
  model: document
  path: userChallenges/{userChallengeId}
  docs: Represents an assigned challenge to a user
  type:
    type: object
    fields:
      userId:
        type: string
        docs: Reference to the user document
      challengeId:
        type: string
        docs: Reference to the challenge template document
      status:
        type: ChallengeStatus
        docs: Current status of the challenge
      assignedAt:
        type: timestamp
        docs: When the challenge was assigned
      startedAt:
        type: TimestampOrNil
        optional: true
        docs: When the challenge was started
      finishedAt:
        type: TimestampOrNil
        optional: true
        docs: When the challenge was completed
      points:
        type: double
        docs: Points awarded for completing the challenge
      type:
        type: ChallengeType
        docs: Type of the challenge
      retriesLeft:
        type: int
        docs: Number of times the user can retry the challenge
        optional: true

Opponent:
  model: document
  path: opponents/{opponentId}
  docs: Represents a fictional opponent for competition
  type:
    type: object
    fields:
      id:
        type: string
        docs: Document ID
      userId:
        type: string
        docs: ID of the user this opponent belongs to
      name:
        type: string
        docs: Name of the opponent
      currentPoints:
        type: double
        docs: Current points of the opponent
      ranking:
        type: double
        optional: true
        docs: Current ranking position
      level:
        type: UserLevel
        docs: Opponent's fitness level
      createdAt:
        type: timestamp
        docs: When the opponent record was created
      updatedAt:
        type: timestamp
        docs: When the opponent record was last updated
      lastUpdated:
        type: timestamp
        docs: When the opponent was last updated (review needed)

Leaderboard:
  model: document
  path: leaderboard/{leaderboardId}
  docs: Represents an entry in the leaderboard
  type:
    type: object
    fields:
      entityType:
        type: EntityType
        docs: Type of the entity (user or opponent)
      entityId:
        type: string
        docs: Reference to user or opponent ID
      userId:
        type: string
        docs: ID of the user this leaderboard entry relates to
      level:
        type: UserLevel
        docs: Level associated with the entry
      points:
        type: double
        docs: Total points
      rank:
        type: double
        optional: true
        docs: Calculated rank for the user's leaderboard
      lastUpdated:
        type: timestamp