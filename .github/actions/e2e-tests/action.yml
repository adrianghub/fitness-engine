name: 'Run E2E Tests'
description: 'Sets up environment, runs E2E tests, and handles cleanup'

outputs:
  test_result:
    description: 'Result of the E2E tests (success or failure)'
    value: ${{ steps.e2e_tests.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Setup Playwright
      shell: bash
      run: pnpm test:e2e:install

    - name: Run E2E Tests
      id: e2e_tests
      shell: bash
      run: pnpm run test:e2e:ci

    - name: Cleanup
      shell: bash
      run: pnpm emulators:reset && pnpm screenshots:cleanup -- --keep=3
