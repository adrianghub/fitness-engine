name: 'Run E2E Tests'
description: 'Sets up environment, runs E2E tests, and handles cleanup'

inputs:
  firebase-token:
    description: 'Firebase CI token for authentication (optional)'
    required: false
  project-id:
    description: 'Firebase project ID (optional)'
    required: false

outputs:
  test_result:
    description: 'Result of the E2E tests (success or failure)'
    value: ${{ steps.e2e_tests.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Install Firebase CLI
      shell: bash
      run: npm install -g firebase-tools

    - name: Prepare Test Environment
      shell: bash
      run: |
        # Clean up screenshots from previous runs
        pnpm run screenshots:cleanup -- --keep=3

        # Kill any running processes on emulator ports (if any)
        pkill -f "firebase" || true
        pkill -f "java.*emulator" || true

        # A short pause to ensure ports are released
        sleep 2

    - name: Reset and Start Emulators
      id: start_emulators
      shell: bash
      env:
        FIREBASE_TOKEN: ${{ inputs.firebase-token }}
        FIREBASE_PROJECT_ID: ${{ inputs.project-id }}
      run: |
        # Configure emulators to run in CI
        export FIREBASE_CI=true

        # Set project configuration if provided
        if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_TOKEN" ]; then
          echo "Using Firebase project: $FIREBASE_PROJECT_ID"
          firebase use "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
        fi

        # Create a temporary firebase.json if it doesn't exist
        if [ ! -f "firebase.json" ]; then
          echo "Creating temporary firebase.json for emulators"
          echo '{
            "emulators": {
              "auth": { "port": 9099 },
              "functions": { "port": 5001 },
              "firestore": { "port": 8080 },
              "ui": { "port": 4000 }
            }
          }' > firebase.json
        fi

        # Skip function emulation if directory doesn't exist
        if [ ! -d "functions" ]; then
          echo "⚠️ Functions directory not found, disabling functions emulation"
          export FIRESTORE_EMULATOR_ONLY=true
        fi

        # Use the pre-defined script to reset and start emulators
        pnpm run emulators:reset

        # Verify emulators are running by checking the UI
        echo "Verifying emulator UI is ready..."
        for i in {1..10}; do
          if curl -s http://127.0.0.1:4000 > /dev/null || curl -s http://127.0.0.1:4001 > /dev/null; then
            echo "✅ Emulator UI is ready"
            break
          fi
          echo "Waiting for emulator UI... (attempt $i/10)"
          sleep 5
          if [ $i -eq 10 ]; then
            echo "::warning::Emulator UI could not be reached, but continuing anyway"
          fi
        done

    - name: Run Unit Tests
      shell: bash
      run: pnpm test

    - name: Setup Playwright
      shell: bash
      run: pnpm exec playwright install chromium --with-deps

    - name: Run E2E Tests
      id: e2e_tests
      shell: bash
      run: pnpm run test:e2e:ci

    - name: List Generated Artifacts
      if: always()
      shell: bash
      run: |
        echo "Screenshot artifacts are available at the following paths:"
        echo "- e2e/screenshots"
        echo "- test-results"
        echo "- playwright-report"
        # Ensure directories exist (if empty) for easier artifact collection
        mkdir -p e2e/screenshots
        mkdir -p test-results
        mkdir -p playwright-report

    - name: Cleanup After Tests
      if: always()
      shell: bash
      run: |
        # Use the pre-defined script to clean up screenshots, keeping only the most recent
        pnpm run screenshots:cleanup -- --keep=3

        # Ensure all emulator processes are stopped
        pkill -f "firebase" || true
        pkill -f "java.*emulator" || true