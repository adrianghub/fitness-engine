name: Test and Deploy to Firebase

on:
  push:
    branches:
      - trunk

  # Allow manual triggering
  workflow_dispatch:

jobs:
  e2e_tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.run_e2e_tests.outputs.test_result }}

    env:
      CI: true
      LOG_LEVEL: info
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Clean up any existing emulators
        run: |
          # Make sure no emulators are running from previous jobs
          node scripts/cleanup-emulators.js --keep=3
          pkill -f "firebase" || true
          pkill -f "java.*emulator" || true
          # Small wait to ensure ports are freed
          sleep 3

      - name: Start Firebase Emulators
        id: start_emulators
        run: |
          # Start emulators using the standardized script
          node scripts/reset-emulators.js

          # Verify emulators are running by checking the UI
          MAX_ATTEMPTS=10
          COUNTER=0
          EMULATOR_UI_READY=false

          while [ $COUNTER -lt $MAX_ATTEMPTS ] && [ "$EMULATOR_UI_READY" = false ]; do
            if curl -s http://127.0.0.1:4000 > /dev/null || curl -s http://127.0.0.1:4001 > /dev/null; then
              EMULATOR_UI_READY=true
              echo "Emulator UI is ready"
            else
              echo "Waiting for emulator UI to be ready (attempt $COUNTER of $MAX_ATTEMPTS)..."
              sleep 5
              COUNTER=$((COUNTER + 1))
            fi
          done

          if [ "$EMULATOR_UI_READY" = false ]; then
            echo "::warning::Emulator UI could not be reached, but continuing anyway"
          fi

      - name: Run E2E Tests
        id: run_e2e_tests
        uses: ./.github/actions/e2e-tests

  deploy:
    name: Build and Deploy
    needs: e2e_tests
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Setup Google Cloud Credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Verify Firebase Project
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          firebase projects:list
          firebase use ${{ env.VITE_FIREBASE_PROJECT_ID }}

      - name: Build and Deploy
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          npm run deploy